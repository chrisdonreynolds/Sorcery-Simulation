name: Continuous Balance Tuner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: balance-tuner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tuner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy
          fi

      - name: Run Simulation Suite
        run: python balance_tuner.py

      - name: Save Tuning Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add ai_bots_dna.json data_log.json
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update tuning data [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes in tuning data to commit."
          fi
