name: Continuous Balance Tuner

on:
  schedule:
    - cron: "*/15 * * * *" # Runs every 30 minutes
  workflow_dispatch: # Gives you a button to start/stop manually

permissions:
  contents: write # Allows the bot to save data back to your repo

jobs:
  run-tuner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run Simulation Suite
        run: python balance_tuner.py
        
      - name: Save Tuning Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ai_bots_dna.json data_log.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update tuning data"
          git push

